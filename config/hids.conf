# config/hids.conf — HIDS settings, sourced by lib/core.sh (hids::load_config).
# These are plain bash variables. Edit here instead of touching the scripts.

# ---- System health thresholds (Module 1) ----
HEALTH_LOAD_PER_CORE=2.0        # alert if 1-min load > (cores * this)
HEALTH_MEM_MIN_AVAIL_PCT=10     # alert if available memory drops below this %
HEALTH_DISK_MAX_PCT=90          # alert if any mount is above this % used

# ---- User activity (Module 2) ----
FAILED_LOGIN_THRESHOLD=10       # alert if failed logins (btmp) exceed this

# ---- File integrity (Module 4): sensitive files to hash and watch ----
WATCH_FILES=(
  /etc/passwd
  /etc/shadow
  /etc/sudoers
  /etc/ssh/sshd_config
  /etc/crontab
  /root/.ssh/authorized_keys
)

# ---- Honeypot canary: nothing legitimate ever touches this file ----
# If it doesn't exist, the HIDS creates it with fake contents on first run.
CANARY_FILE="/root/.ssh/backup_keys"

# ---- Suspicious execution directories (Module 3) ----
SUSPICIOUS_DIRS=(/tmp /var/tmp /dev/shm)

# ---- SUID/SGID whitelist (Module 4): known-good, never alert on these ----
SUID_WHITELIST=(
  /usr/bin/sudo
  /usr/bin/passwd
  /usr/bin/chsh
  /usr/bin/chfn
  /usr/bin/newgrp
  /usr/bin/gpasswd
  /usr/bin/mount
  /usr/bin/umount
  /usr/bin/su
  /usr/bin/fusermount3
  /usr/lib/dbus-1.0/dbus-daemon-launch-helper
  /usr/lib/openssh/ssh-keysign
  /usr/lib/policykit-1/polkit-agent-helper-1
)
# --- Correlation engine (attack-chain detection) ---
CORRELATE_SCORE_MIN=10     # minimum combined risk score to raise a chain alert
CORRELATE_MODULES_MIN=2    # ...AND at least this many DIFFERENT modules must fire
# --- Notification hook ---
NOTIFY_ENABLED=1                       # 0 to silence all notifications
NOTIFY_METHOD=email                    # email (msmtp); desktop/slack are future swap-ins
NOTIFY_MIN_SEVERITY=high               # notify on 'high' and above, or set 'critical'
NOTIFY_EMAIL_TO="your-email@example.com" # where alerts go
